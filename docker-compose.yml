# EventPro Local Development Environment
#
# This docker-compose.yml provides a complete local development setup including:
# - Infrastructure: PostgreSQL, LocalStack (AWS services emulation)
# - Application Services: Backend API (Spring Boot), Frontend (React)
# - Lambda Functions: Order Processor, Payment Processor, Notification Sender
#
# Quick Start:
#   1. Run: make local-infra (provisions resources and creates .env files)
#   2. Run: make local-up (starts all services)
#
# Services:
#   - Frontend: http://localhost:5173
#   - Backend API: http://localhost:8080
#   - Backend Health: http://localhost:8080/actuator/health
#   - LocalStack: http://localhost:4566
#   - PostgreSQL: localhost:5432
#
# Lambda Functions:
#   - Order Processor: Managed by LocalStack (automatically triggered by SQS)
#   - Payment Processor: Managed by LocalStack (automatically triggered by SQS)
#   - Notification Sender: Managed by LocalStack (automatically triggered by SQS)
#
# Lambda functions are registered in LocalStack via Terraform and automatically
# triggered when messages arrive in SQS queues. See infrastructure/environments/local/main.tf

services:
  # Database - PostgreSQL for local development
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: eventpro
      POSTGRES_USER: eventpro
      POSTGRES_PASSWORD: eventpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpro -d eventpro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eventpro

  # LocalStack - AWS services emulation for local development
  localstack:
    image: localstack/localstack:4.10.0
    container_name: localstack
    environment:
      - SERVICES=sqs,s3,secretsmanager,cognito-idp,sns,ses,lambda,logs,iam
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_REMOTE_DOCKER=false
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - eventpro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # EventPro Backend API - Development mode with hot reload
  backend:
    image: gradle:8.5-jdk21
    container_name: backend
    working_dir: /app
    volumes:
      # Mount entire backend directory to access services, shared, and lambdas
      # This allows DevTools to detect changes and hot reload
      # The shared module is needed for composite builds
      - ./backend:/app/backend
      - gradle_cache:/root/.gradle
    ports:
      - "8080:8080"
      - "35729:35729"  # DevTools LiveReload port
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=eventpro
      - DB_USERNAME=eventpro
      - DB_PASSWORD=eventpro
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-eventpro-images-local}
      # SQS Queue URLs - loaded from .env file (created by make local-infra)
      # If not set, application-local.yml defaults will be used
      - ORDER_QUEUE_URL=${ORDER_QUEUE_URL:-}
      - PAYMENT_QUEUE_URL=${PAYMENT_QUEUE_URL:-}
      - NOTIFICATION_QUEUE_URL=${NOTIFICATION_QUEUE_URL:-}
      # JWT Configuration - set in .env file for local development
      - JWT_ISSUER=${JWT_ISSUER:-eventpro}
      - JWT_ACCESS_TTL_SECONDS=${JWT_ACCESS_TTL_SECONDS:-3600}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      # Stripe Configuration - set in .env file for local development
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_local}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_local}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_test_local}
      # Enable DevTools for hot reload
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    command: >
      sh -c "
        cd /app/backend/services &&
        chmod +x ./gradlew &&
        ./gradlew :eventpro-api:bootRun --no-daemon --continuous
      "
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - eventpro
    stdin_open: true
    tty: true

  # Frontend Development Server - Hot Module Replacement enabled
  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Vite reads from process.env (Docker) or .env.local file (when running directly)
      # Docker Compose automatically reads .env file from project root
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_AWS_REGION=us-east-1
      - VITE_S3_BUCKET_NAME=${S3_BUCKET_NAME:-eventpro-images-local}
      # Stripe Configuration (optional - for payment features)
      - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - eventpro
    stdin_open: true
    tty: true

  # Note: Lambda functions (order-processor, payment-processor, notification-sender)
  # are now managed by LocalStack via Terraform. They are automatically triggered
  # by SQS event source mappings when messages arrive in queues.
  # See infrastructure/environments/local/main.tf for Lambda configuration.

volumes:
  postgres_data:
  localstack_data:
  gradle_cache:

networks:
  eventpro:
    driver: bridge
