name: Frontend

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace to deploy to'
        required: true
        default: 'dev'
        type: string
      run_deploy:
        description: 'Run deploy steps (Terraform apply + S3 sync + invalidation)'
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace to deploy to'
        required: true
        default: 'dev'
        type: string
      run_deploy:
        description: 'Run deploy steps (Terraform apply + S3 sync + invalidation)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  DEPLOY_WORKSPACE: ${{ inputs.workspace || github.event.inputs.workspace || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace || github.event.inputs.workspace || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: eventpro-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: eventpro-frontend

      - name: Build
        run: npm run build
        working-directory: eventpro-frontend
        env:
          VITE_API_BASE_URL: https://${{ env.DEPLOY_WORKSPACE }}-api.${{ vars.DOMAIN_NAME }}

      - name: Terraform
        if: ${{ github.event_name == 'push' || inputs.run_deploy }}
        uses: ./.github/actions/terraform
        with:
          working-directory: eventpro-frontend/terraform
          workspace: ${{ env.DEPLOY_WORKSPACE }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          backend-bucket: eventpro-site-state
          backend-key: frontend/terraform.tfstate
          variables: domain_name=${{ vars.DOMAIN_NAME }}

      - name: Sync to S3
        if: ${{ github.event_name == 'push' || inputs.run_deploy }}
        run: |
          cd eventpro-frontend/terraform
          terraform init -backend-config=bucket=eventpro-site-state -backend-config=key=frontend/terraform.tfstate -backend-config=region=${{ env.AWS_REGION }} -backend-config=use_lockfile=true
          terraform workspace select ${{ env.DEPLOY_WORKSPACE }} || terraform workspace new ${{ env.DEPLOY_WORKSPACE }}
          BUCKET=$(terraform output -raw bucket_name)
          cd ../..
          aws s3 sync eventpro-frontend/dist/ s3://$BUCKET/ --delete

      - name: CloudFront invalidation
        if: ${{ github.event_name == 'push' || inputs.run_deploy }}
        run: |
          cd eventpro-frontend/terraform
          DIST_ID=$(terraform output -raw distribution_id)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
