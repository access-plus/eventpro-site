name: API

on:
  push:
    tags:
      - 'api-v*.*.*'
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace to deploy to'
        required: false
        default: 'dev'
        type: string
      run_deploy:
        description: 'Run deploy steps (ECR push + Terraform apply)'
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace to deploy to'
        required: false
        default: 'dev'
        type: string
      run_deploy:
        description: 'Run deploy steps (ECR push + Terraform apply)'
        required: false
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  DEPLOY_WORKSPACE: ${{ inputs.workspace || github.event.inputs.workspace || 'dev' }}

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/actions/gradle-task
        with:
          working-directory: backend/services
          java-version: '25'

      - name: Resolve image tags
        id: image-meta
        uses: ./.github/actions/image-tags
        with:
          tag-prefix: api-v

      - name: ecr-docker-build
        id: ecr-docker-build
        if: ${{ github.event_name == 'push' || inputs.run_deploy }}
        uses: ./.github/actions/docker
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          ecr-repository: eventpro-api
          context: backend
          dockerfile: backend/services/Dockerfile
          image-tag: ${{ steps.image-meta.outputs.primary_tag }}
          image-tags: ${{ steps.image-meta.outputs.all_tags }}

      - name: deploy
        if: ${{ github.event_name == 'push' || inputs.run_deploy }}
        uses: ./.github/actions/terraform
        env:
          TF_VAR_jwt_public_key: ${{ secrets.JWT_PUBLIC_KEY }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
        with:
          working-directory: backend/services/terraform
          workspace: ${{ env.DEPLOY_WORKSPACE }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          variables: |
            image_registry=${{ steps.ecr-docker-build.outputs.image-registry }}
            image_name=${{ steps.ecr-docker-build.outputs.image-name }}
            image_tag=${{ steps.ecr-docker-build.outputs.image-tag }}
            domain_name=${{ vars.DOMAIN_NAME || secrets.DOMAIN_NAME }}
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            stripe_webhook_secret=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            stripe_price_pro_monthly=${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
            stripe_price_pro_yearly=${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
            stripe_price_enterprise_monthly=${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
            stripe_price_enterprise_yearly=${{ secrets.STRIPE_PRICE_ENTERPRISE_YEARLY }}
            new_relic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}
