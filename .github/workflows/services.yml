name: API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/actions/gradle-task
        with:
          working-directory: backend/services
          java-version: '25'

      - name: ecr-docker-build
        id: ecr-docker-build
        uses: ./.github/actions/docker
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          ecr-repository: eventpro-api
          context: backend
          dockerfile: backend/services/Dockerfile
          image-tag: ${{ github.sha }}

      - name: deploy
        uses: ./.github/actions/terraform
        with:
          working-directory: backend/services/terraform
          workspace: dev
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          backend-bucket: eventpro-site-state
          backend-key: services/terraform.tfstate
          variables: image_registry=${{ steps.ecr-docker-build.outputs.image-registry }},image_name=${{ steps.ecr-docker-build.outputs.image-name }},image_tag=${{ steps.ecr-docker-build.outputs.image-tag }},domain_name=${{ vars.DOMAIN_NAME }},alb_certificate_arn=${{ vars.ACM_CERTIFICATE_ARN }},cloudfront_certificate_arn=${{ vars.ACM_CERTIFICATE_ARN }}
