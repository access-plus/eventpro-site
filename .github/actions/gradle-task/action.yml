name: Build gradle project
description: Build gradle project with JDK 25

inputs:
  test:
    default: "yes"
    description: "Run tests?"
    required: false
  working-directory:
    description: working directory
    required: true
  java-version:
    description: Java version
    default: "25"
    required: false

runs:
  using: "composite"
  steps:
  - name: Set up JDK
    uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
    with:
      distribution: 'temurin'
      java-version: ${{ inputs.java-version }}

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda

  # - name: Ensure Gradle Wrapper is Executable
  #   run: chmod +x gradlew
  #   shell: bash

  # - name: Verify Gradle Version
  #   run: ./gradlew --version
  #   shell: bash

  - name: gradle clean
    run: |
      cd ${{ inputs.working-directory }}
      ./gradlew clean
    shell: bash

  - name: gradle build
    run: |
      cd ${{ inputs.working-directory }}
      if [[ "${{ inputs.test }}" == "no" ]]; then
        echo "Skipping tests"
        ./gradlew build -x test
      else
        ./gradlew build
      fi
    shell: bash
