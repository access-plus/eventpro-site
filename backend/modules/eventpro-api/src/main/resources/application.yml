spring:
  application:
    name: eventpro-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpro}
    username: ${DB_USERNAME:eventpro}
    password: ${DB_PASSWORD:eventpro}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

aws:
  region: ${AWS_REGION:us-east-1}
  # Cognito Configuration - REQUIRED
  # COGNITO_USER_POOL_ID and COGNITO_CLIENT_ID must be set via environment variables
  # The application will fail to start if these are not configured
  cognito:
    userPoolId: ${COGNITO_USER_POOL_ID}  # REQUIRED
    clientId: ${COGNITO_CLIENT_ID}  # REQUIRED
  s3:
    bucketName: ${S3_BUCKET_NAME}
  sqs:
    endpoint: ${SQS_ENDPOINT:} # Optional: for LocalStack (e.g., http://localhost:4566)
    orderQueueUrl: ${ORDER_QUEUE_URL}
    paymentQueueUrl: ${PAYMENT_QUEUE_URL}
    notificationQueueUrl: ${NOTIFICATION_QUEUE_URL}
  ses:
    region: ${AWS_REGION:us-east-1}
  sns:
    region: ${AWS_REGION:us-east-1}
  secrets:
    manager:
      databaseSecret: ${DB_SECRET_ARN:}
      stripeSecret: ${STRIPE_SECRET_ARN:}

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  publishableKey: ${STRIPE_PUBLISHABLE_KEY}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET}

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.accessplus.eventpro: INFO
    org.springframework: WARN
    org.springframework.boot.context.logging: WARN
    org.springframework.boot.logging: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2}] (%t) %s%e%n"

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

