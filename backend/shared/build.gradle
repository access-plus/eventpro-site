plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.accessplus.eventpro'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta Persistence API (JPA) - Framework agnostic
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    
    // Hibernate annotations (for UUID, timestamps) - Framework agnostic
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
    
    // Jackson for JSON serialization (DTOs/Models)
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    
    // Lombok for boilerplate reduction
    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Publishing configuration for local Maven repository
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.accessplus.eventpro'
            artifactId = 'eventpro-shared'
            version = project.version
        }
    }
    repositories {
        mavenLocal()
    }
}

