plugins {
    id 'java'
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.accessplus.eventpro.EventProApplication'
}

dependencies {
    // Shared module (framework-agnostic entities, enums, exceptions, utilities)
    implementation 'com.accessplus.eventpro:eventpro-shared:1.0.0'
    
    // Include all modules
    implementation project(':eventpro-core')
    implementation project(':eventpro-event')
    implementation project(':eventpro-order')
    implementation project(':eventpro-payment')
    implementation project(':eventpro-notification')
    
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Database Migration - Use Spring Boot starter for proper auto-configuration
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // PostgreSQL 16 support (required for PostgreSQL 16.11)
    implementation 'org.flywaydb:flyway-database-postgresql'
    
    // OpenAPI/Swagger Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    
    // Spring Boot DevTools (for hot reload in development)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Lombok
    compileOnly "org.projectlombok:lombok:${project.ext.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${project.ext.lombokVersion}"
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Disable plain JAR (only create executable JAR)
jar {
    enabled = false
}

// Configure bootJar task
bootJar {
    archiveBaseName = 'eventpro-api'
    archiveVersion = project.version
}
