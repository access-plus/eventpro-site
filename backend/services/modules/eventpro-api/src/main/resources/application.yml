spring:
  application:
    name: eventpro-api
  # DataSource configuration is handled by SecretsManagerDataSourceConfig (non-local) or LocalDataSourceConfig (local)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucketName: ${S3_BUCKET_NAME}
  sqs:
    endpoint: ${SQS_ENDPOINT:} # Optional: for LocalStack (e.g., http://localhost:4566)
    orderQueueUrl: ${ORDER_QUEUE_URL}
    paymentQueueUrl: ${PAYMENT_QUEUE_URL}
    notificationQueueUrl: ${NOTIFICATION_QUEUE_URL}
  ses:
    region: ${AWS_REGION:us-east-1}
  sns:
    region: ${AWS_REGION:us-east-1}
  secrets-manager:
    secret-arn: ${DB_SECRET_ARN:}  # RDS-managed secret ARN for database credentials (only for non-local profiles)

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  publishableKey: ${STRIPE_PUBLISHABLE_KEY}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET}

security:
  jwt:
    issuer: ${JWT_ISSUER:eventpro}
    accessTokenTtlSeconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    publicKey: ${JWT_PUBLIC_KEY}
    privateKey: ${JWT_PRIVATE_KEY}

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.accessplus.eventpro: INFO
    org.springframework: WARN
    org.springframework.boot.context.logging: WARN
    org.springframework.boot.logging: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2}] (%t) %s%e%n"

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
