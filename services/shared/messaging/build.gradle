plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${project.ext.springBootVersion}"
    }
}

dependencies {
    // AWS SDK v2 (version managed by BOM)
    implementation platform("software.amazon.awssdk:bom:${project.ext.awsSdkVersion}")
    implementation 'software.amazon.awssdk:sqs'
    
    // Jackson for JSON (provided by Spring Boot)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Lombok (version from root build.gradle)
    compileOnly "org.projectlombok:lombok:${project.ext.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${project.ext.lombokVersion}"
    
    // Shared common
    implementation project(':shared:common')
}
