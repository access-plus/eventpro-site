plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${project.ext.springBootVersion}"
    }
}

dependencies {
    // Spring Data JPA (version managed by dependency-management plugin)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL (version from root build.gradle)
    runtimeOnly "org.postgresql:postgresql:${project.ext.postgresqlVersion}"
    
    // AWS SDK v2 (version managed by BOM)
    implementation platform("software.amazon.awssdk:bom:${project.ext.awsSdkVersion}")
    implementation 'software.amazon.awssdk:secretsmanager'
}
