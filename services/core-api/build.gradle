plugins {
    id 'java'
    // Spring Boot 3.5.7
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Spring Boot configuration
springBoot {
    mainClass = 'com.accessplus.eventpro.core.CoreApiApplication'
}

dependencies {
    // Spring Boot Starters (versions managed by BOM)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // AWS SDK v2 (using version from root build.gradle)
    implementation platform("software.amazon.awssdk:bom:${project.ext.awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:secretsmanager'
    implementation 'com.amazonaws:aws-java-sdk-cognitoidp:1.12.500'
    
    // Database
    runtimeOnly "org.postgresql:postgresql:${project.ext.postgresqlVersion}"
    
    // Lombok (using version from root build.gradle)
    compileOnly "org.projectlombok:lombok:${project.ext.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${project.ext.lombokVersion}"
    
    // Shared modules
    implementation project(':shared:common')
    implementation project(':shared:messaging')
    implementation project(':shared:database')
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Disable plain JAR (only create executable JAR)
jar {
    enabled = false
}

// Configure bootJar task
bootJar {
    archiveBaseName = 'core-api'
    archiveVersion = project.version
}
