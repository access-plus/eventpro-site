plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.accessplus.events'
version = '0.0.1'
description = 'services'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jwtVersion = '0.13.0'
    googleVersion = '3.5.4'
    modelMapperVersion = '3.2.6'
    springDocVersion = '2.8.14'
    stripeVersion = '30.2.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // Google Libraries
    implementation 'com.google.zxing:core:${googleVersion}'
    implementation 'com.google.zxing:javase:${googleVersion}'
    implementation 'com.google.code.gson:gson:2.13.2'
    
    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'commons-fileupload:commons-fileupload:1.6.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'


    // AWS SDK
    implementation 'software.amazon.awssdk:ses:2.16.37'
    testImplementation 'software.amazon.awssdk:s3:2.21.23'
    
    // AWS Spring Cloud
    implementation 'io.awspring.cloud:spring-cloud-starter-aws-secrets-manager-config:2.4.4'
    
    // SendGrid
    implementation 'com.sendgrid:sendgrid-java:4.10.3'
    
    // ModelMapper
    implementation 'org.modelmapper:modelmapper:${modelMapperVersion}'
    
    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jwtVersion}"

    // SpringDoc OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}'
    
    // Servlet API (jakarta)
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // Payment Gateways
    implementation 'com.stripe:stripe-java:${stripeVersion}'
    implementation 'com.paypal.sdk:paypal-core:1.7.2'
    implementation 'com.paypal.sdk:rest-api-sdk:1.14.0'
    
    
    // Jackson
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // H2 Database (for tests)
    testImplementation 'com.h2database:h2:1.4.200'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.rest-assured:rest-assured:5.3.1' {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
        testImplementation 'org.testng:testng:7.8.0' {
        exclude group: 'org.webjars', module: 'jquery'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    useTestNG()
}
