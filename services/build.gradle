plugins {
    id 'java'
    // Spring Boot plugin (available but not applied - subprojects apply it)
    id 'org.springframework.boot' version '3.5.7' apply false
    // Spring Dependency Management plugin (available but not applied - subprojects apply it)
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.accessplus.eventpro'
    version = '1.0.0'
    
    repositories {
        mavenCentral()
        // Spring repositories for snapshots if needed
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    apply plugin: 'java'
    
    // Java 21 configuration for all subprojects
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    // Common dependency management for all subprojects
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }
    
    // Common test configuration
    tasks.named('test') {
        useJUnitPlatform()
    }
    
    // Common dependency versions (can be overridden in subprojects)
    ext {
        // Spring Boot version (managed by BOM in Spring Boot projects)
        springBootVersion = '3.5.7'
        
        // AWS SDK version
        awsSdkVersion = '2.21.29'
        
        // Lombok version
        lombokVersion = '1.18.30'
        
        // PostgreSQL driver version
        postgresqlVersion = '42.7.1'
        
        // Quarkus version (for Lambda projects)
        quarkusVersion = '3.27.0'
    }
}