pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id 'io.quarkus' version '3.27.0'
    }
}

rootProject.name = 'services'

// ECS Services (Spring Boot)
include 'core-api'
include 'event-api'

// Lambda Functions (Quarkus)
include 'lambdas:order-processor'
include 'lambdas:payment-processor'
include 'lambdas:notification-sender'
include 'lambdas:analytics-service'

// Shared Libraries
include 'shared:common'
include 'shared:messaging'
include 'shared:database'