spring:
  application:
    name: eventpro-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpro}
    username: ${DB_USERNAME:eventpro}
    password: ${DB_PASSWORD:eventpro}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

aws:
  cognito:
    userPoolId: ${COGNITO_USER_POOL_ID}
    clientId: ${COGNITO_CLIENT_ID}
    region: ${AWS_REGION:us-east-1}
  s3:
    bucketName: ${S3_BUCKET_NAME}
  ses:
    region: ${AWS_REGION:us-east-1}
  sns:
    region: ${AWS_REGION:us-east-1}
  secrets:
    manager:
      databaseSecret: ${DB_SECRET_ARN}

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  publishableKey: ${STRIPE_PUBLISHABLE_KEY}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET}

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.accessplus.eventpro: INFO
    org.springframework: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"

