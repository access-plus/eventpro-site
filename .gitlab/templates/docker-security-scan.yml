# Docker Security Scan Template
# 
# This template provides a comprehensive security scan for Docker images using Trivy.
# It generates both JSON (for GitLab security dashboard) and HTML (for human reading) reports.
#
# Usage:
#   my-security-scan:
#     extends: .docker-security-scan
#     variables:
#       DOCKER_IMAGE: "myregistry/myapp:latest"
#
# Required Variables:
#   DOCKER_IMAGE: The full image name and tag to scan (e.g., "registry.com/app:v1.0.0")
#
# Optional Variables:
#   None - all other settings are configured with sensible defaults
#
# Output:
#   - JSON report: reports/security-report-{sanitized-image-name}.json
#   - Console output: Summary table with CRITICAL and HIGH severity issues
#
.docker-security-scan:
  image: 
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  variables:
    # Default to empty string if not provided
    DOCKER_IMAGE: ""
  script:
    - |
      # Validate that DOCKER_IMAGE is provided
      if [ -z "$DOCKER_IMAGE" ]; then
        echo "Error: DOCKER_IMAGE variable is required but not set"
        echo "Usage: Set DOCKER_IMAGE variable to the image you want to scan"
        echo "Example: DOCKER_IMAGE=myregistry/myapp:latest"
        exit 1
      fi
      
      echo "Starting security scan for: $DOCKER_IMAGE"
      
      # Create reports directory
      mkdir -p reports
      
      # Generate unique report names based on image name
      IMAGE_NAME=$(echo "$DOCKER_IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')
      JSON_REPORT="reports/security-report-${IMAGE_NAME}.json"
      
      # Scan and write JSON report (for GitLab security dashboard)
      echo "Generating JSON report: $JSON_REPORT"
      trivy image \
        --format json \
        --output "$JSON_REPORT" \
        --severity "CRITICAL,HIGH,MEDIUM,LOW" \
        "$DOCKER_IMAGE"
      
      # Show summary in console
      echo "=== SECURITY SCAN SUMMARY ==="
      trivy image \
        --format table \
        --severity "CRITICAL,HIGH" \
        "$DOCKER_IMAGE"
      
      echo "Security reports generated:"
      echo "  - $JSON_REPORT"
  artifacts:
    paths:
      - reports/
    expire_in: 1 week
    when: always