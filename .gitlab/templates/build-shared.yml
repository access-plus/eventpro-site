.build-shared:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  before_script:
    - cd backend/shared
  script:
    - echo "Building shared module"
    - ./gradlew build -x test publishToMavenLocal
    - echo "Shared module build completed"
  artifacts:
    paths:
      - backend/shared/build/libs/
    expire_in: 1 week

