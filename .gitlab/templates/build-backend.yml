.build-backend:
  image: eclipse-temurin:25-jdk-alpine
  stage: build
  before_script:
    - cd backend/services
  script:
    - echo "Building backend services"
    - | 
      echo "Backend services have changes, building..."; 
      ./gradlew build -x test; 
      echo "Backend services build completed"; 

  artifacts:
    paths:
      - backend/services/build/libs/
    expire_in: 1 week

