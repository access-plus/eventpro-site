.build-backend:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  before_script:
    - cd backend
  script:
    - echo "Building backend"
    - | 
      echo "Backend has changes, building..."; 
      ./gradlew build -x test; 
      echo "Backend build completed"; 

  artifacts:
    paths:
      - backend/build/libs/
    expire_in: 1 week

