# Hidden, reusable job template for Snyk Gradle scans in a monorepo
.snyk-code-scan:
  stage: security
  image: 
    name: snyk/snyk:gradle-9-jdk21-preview
    entrypoint: [""]
  variables:
    # ---- overridables (safe defaults) ----
    SERVICE_DIR: ""                         # change per job/pipeline
    SNYK_SEVERITY_THRESHOLD: "medium"                # low|medium|high|critical
    SNYK_FAIL_ON: "all"                              # all|upgradable
    PROJECT_NAME: "${CI_PROJECT_PATH}/${SERVICE_DIR}"
  before_script:
    - test -n "$SNYK_TOKEN" || { echo "SNYK_TOKEN not set"; exit 1; }
    - snyk auth "$SNYK_TOKEN"
    # Resolve Gradle build file (supports Kotlin DSL too)
    - |
      set -euo pipefail
      if [ -f "${SERVICE_DIR}/build.gradle.kts" ]; then
        export BUILD_FILE="${SERVICE_DIR}/build.gradle.kts"
      elif [ -f "${SERVICE_DIR}/build.gradle" ]; then
        export BUILD_FILE="${SERVICE_DIR}/build.gradle"
      else
        echo "Could not find build.gradle(.kts) in ${SERVICE_DIR}"
        ls -la "${SERVICE_DIR}" || true
        exit 2
      fi
      echo "Using build file: ${BUILD_FILE}"
  script:
    - echo "Starting Snyk security scan for ${SERVICE_DIR}"
    - echo "Build file ${BUILD_FILE}"
    - echo "Project name ${PROJECT_NAME}"
    - |
      # Generate all reports first (don't fail on vulnerabilities)
      echo "Generating JSON report..."
      snyk test \
        --file="${BUILD_FILE}" \
        --project-name="${PROJECT_NAME}" \
        --severity-threshold="${SNYK_SEVERITY_THRESHOLD}" \
        --json-file-output="snyk-${SERVICE_DIR}.json" || echo "JSON report generation failed"
    - |
      echo "Generating SARIF report..."
      snyk test \
        --file="${BUILD_FILE}" \
        --project-name="${PROJECT_NAME}" \
        --severity-threshold="${SNYK_SEVERITY_THRESHOLD}" \
        --sarif-file-output="snyk-${SERVICE_DIR}.sarif" || echo "SARIF report generation failed"
    - |
      # Human-readable test (for display purposes only)
      echo "Running Snyk test for display..."
      snyk test \
        --file="${BUILD_FILE}" \
        --project-name="${PROJECT_NAME}" \
        --severity-threshold="${SNYK_SEVERITY_THRESHOLD}" \
        --fail-on="${SNYK_FAIL_ON}" || echo "Snyk test found vulnerabilities (this is expected)"
    - |
      # List generated files
      echo "Generated artifacts:"
      ls -la snyk-${SERVICE_DIR}.* || echo "No artifacts found"
      
      # Send results to Snyk UI for monitoring
      echo "Sending results to Snyk UI..."
      snyk monitor --file="${BUILD_FILE}" --project-name="${PROJECT_NAME}" || echo "Snyk monitoring failed"
      
      # Always succeed - let Snyk UI handle vulnerability reporting
      echo "Snyk scan completed successfully. Check Snyk UI for vulnerability details."
  artifacts:
    when: always
    paths:
      - "snyk-*.json"
      - "snyk-*.sarif"
    expire_in: 7 days
    reports:
      sast: "snyk-${SERVICE_DIR}.sarif"
