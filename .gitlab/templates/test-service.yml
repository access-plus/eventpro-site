.test-service:
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - cd backend
  script:
    - echo "Testing backend"
    - ./gradlew test jacocoTestReport --info
    - echo "Generating aggregated coverage report for GitLab CI"
    - ./gradlew jacocoRootReport --info
    - echo "Test coverage report generated"
  artifacts:
    reports:
      junit: backend/modules/*/build/test-results/test/TEST-*.xml
    paths:
      - backend/modules/*/build/test-results/
      - backend/modules/*/build/reports/jacoco/
      - backend/modules/*/build/reports/tests/
      - backend/build/reports/jacoco/root/
    expire_in: 1 week
