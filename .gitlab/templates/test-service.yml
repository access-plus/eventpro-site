.test-service:
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - cd backend
  script:
    - echo "Testing backend"
    - ./gradlew test jacocoTestReport --info
    - echo "Test coverage report generated"
  artifacts:
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: backend/build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - backend/build/test-results/
      - backend/build/reports/jacoco/
    expire_in: 1 week