# Reusable GitLab CI template for semantic versioning
# Usage: include this template in your .gitlab-ci.yml

variables:
  VERSION_FILE: "VERSION"

.calculate-version:
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache git bash curl
  script:
    - |
      # Ensure directories exist
      mkdir -p $(dirname version.env)
      mkdir -p $(dirname "$VERSION_FILE")
      
      # Ensure VERSION file exists
      if [ ! -f "$VERSION_FILE" ]; then
        echo "0.1.0" > "$VERSION_FILE"
      fi
      
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        # Merge request - preserve current version and add commit SHA
        CURRENT_VERSION=$(cat "$VERSION_FILE")
        # Remove any existing pre-release identifiers
        BASE_VERSION=$(echo $CURRENT_VERSION | cut -d- -f1)
        VERSION="${BASE_VERSION}-mr${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        # Main branch - do semantic versioning based on commit message
        CURRENT_VERSION=$(cat "$VERSION_FILE")
        # Remove any pre-release identifiers for base version
        BASE_VERSION=$(echo $CURRENT_VERSION | cut -d- -f1)
        MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
        MINOR=$(echo $BASE_VERSION | cut -d. -f2) 
        PATCH=$(echo $BASE_VERSION | cut -d. -f3)
        
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -qi "BREAKING CHANGE\|feat!:"; then
          VERSION="$((MAJOR + 1)).0.0"
        elif echo "$COMMIT_MSG" | grep -qi "feat:"; then
          VERSION="$MAJOR.$((MINOR + 1)).0"
        elif echo "$COMMIT_MSG" | grep -qi "fix:"; then
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
        else
          # Default to patch version for other changes
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
        fi
        
        # Update version file (no need to commit back to repo)
        echo "$VERSION" > "$VERSION_FILE"
        
        # Create tag using GitLab API instead of git push
        # This avoids permission issues with git push
        echo "Creating tag v$VERSION for commit $CI_COMMIT_SHA"
        curl --request POST \
          --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{
            \"tag_name\": \"v$VERSION\",
            \"ref\": \"$CI_COMMIT_SHA\",
            \"message\": \"Release v$VERSION\"
          }" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags" && echo "Tag v$VERSION created successfully" || echo "Warning: Failed to create tag via API"
      else
        # Fallback version
        VERSION="0.1.0-dev"
      fi
      
      # Always create version.env
      {
        echo "VERSION=$VERSION"
        echo "APP_VERSION=$VERSION"
        echo "IMAGE_TAG=$VERSION"
        echo "RELEASE_TAG=v$VERSION"
      } > version.env
      
      cat version.env
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - version.env
      - VERSION
