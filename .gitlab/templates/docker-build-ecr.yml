.build-service-docker-image:
  image: 
    name: amazon/aws-cli:2.23.0
    entrypoint: [""]
  stage: docker
  services:
    - docker:27-dind
  variables: 
    DOCKER_HOST: tcp://docker:2375/
  before_script:
    - amazon-linux-extras install docker
    - cd $SERVICES_DIR
  script:
    - aws --version
    - docker version
    - docker image build -t -f $DOCKERFILE_PATH $ECR_REPOSITORY_IMAGE:$VERSION .
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker image push $ECR_REPOSITORY_IMAGE:$VERSION