.build-service-docker-image:
  image: docker:27-cli
  stage: docker
  services:
    - docker:27-dind
  variables: 
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apk add --no-cache aws-cli
    - cd $SERVICES_DIR
  script:
    - aws --version
    - docker version
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker image build -f $DOCKERFILE_PATH -t $ECR_REPOSITORY_IMAGE:$VERSION .
    - docker image push $ECR_REPOSITORY_IMAGE:$VERSION