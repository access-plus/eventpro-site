include:
  - local: .gitlab/templates/calculate-version.yml
  - local: .gitlab/templates/test-service.yml
  - local: .gitlab/templates/test-web.yml
  - local: .gitlab/templates/build-shared.yml
  - local: .gitlab/templates/build-backend.yml
  - local: .gitlab/templates/docker-build-ecr.yml
  - local: .gitlab/templates/terraform-base.yml
  - local: .gitlab/templates/create-release.yml

workflow:
  rules:
    # only run if the pipeline is triggered by a merge request or the branch is the default branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - shared
  - test
  - build
  - docker
  - deploy
  - post-deploy
  - release
  - tear-down

# Use the version calculation template
calculate-version:
  stage: .pre
  extends: .calculate-version

# Test jobs
test-backend:
  extends: .test-service
  stage: test
  needs:
    - job: calculate-version
      artifacts: true

.test-frontend:
  extends: .test-web
  stage: test
  needs:
    - job: calculate-version
      artifacts: true

# Build shared module first (required by services and lambdas)
build-shared:
  extends: .build-shared
  stage: build
  needs:
    - job: calculate-version
      artifacts: true

# Build backend services
gradle-build-backend:
  extends: .build-backend
  stage: build
  needs:
    - job: calculate-version
      artifacts: true
    - job: build-shared
      artifacts: true
    - job: test-backend

# Build Quarkus Lambda functions
gradle-build-order-processor-lambda:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  before_script:
    - cd backend/lambdas/order-processor
  script:
    - echo "Building order-processor lambda"
    - ./gradlew build -x test --no-daemon
    - echo "Order-processor lambda build completed"
  artifacts:
    paths:
      - backend/lambdas/order-processor/build/
    expire_in: 1 week
  needs:
    - job: calculate-version
      artifacts: true
    - job: build-shared
      artifacts: true

gradle-build-payment-processor-lambda:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  before_script:
    - cd backend/lambdas/payment-processor
  script:
    - echo "Building payment-processor lambda"
    - ./gradlew build -x test --no-daemon
    - echo "Payment-processor lambda build completed"
  artifacts:
    paths:
      - backend/lambdas/payment-processor/build/
    expire_in: 1 week
  needs:
    - job: calculate-version
      artifacts: true
    - job: build-shared
      artifacts: true

gradle-build-notification-sender-lambda:
  image: eclipse-temurin:21-jdk-alpine
  stage: build
  before_script:
    - cd backend/lambdas/notification-sender
  script:
    - echo "Building notification-sender lambda"
    - ./gradlew build -x test --no-daemon
    - echo "Notification-sender lambda build completed"
  artifacts:
    paths:
      - backend/lambdas/notification-sender/build/
    expire_in: 1 week
  needs:
    - job: calculate-version
      artifacts: true
    - job: build-shared
      artifacts: true

# Frontend build for testing (without environment variables)
build-frontend-test:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  needs:
    - job: calculate-version
      artifacts: true
    # - job: test-web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Docker build jobs
docker-build-secret-rotation-lambda:
  extends: .docker-build-ecr  
  needs:
    - job: calculate-version
      artifacts: true
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - cd backend
    - docker image build -t $ECR_REGISTRY/eventpro-secret-rotation:$VERSION -f lambdas/secret-rotation/Dockerfile .
    - docker image push $ECR_REGISTRY/eventpro-secret-rotation:$VERSION

docker-build-backend:
  extends: .docker-build-ecr
  needs:
    - job: calculate-version
      artifacts: true
    - job: gradle-build-backend
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - cd backend
    - docker image build -t $ECR_REGISTRY/eventpro-backend:$VERSION -f services/Dockerfile .
    - docker image push $ECR_REGISTRY/eventpro-backend:$VERSION

# Build Quarkus Lambda Docker images
docker-build-order-processor-lambda:
  extends: .docker-build-ecr
  needs:
    - job: calculate-version
      artifacts: true
    - job: gradle-build-order-processor-lambda
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - cd backend
    - docker image build -t $ECR_REGISTRY/eventpro-order-processor:$VERSION -f lambdas/order-processor/Dockerfile .
    - docker image push $ECR_REGISTRY/eventpro-order-processor:$VERSION

docker-build-payment-processor-lambda:
  extends: .docker-build-ecr
  needs:
    - job: calculate-version
      artifacts: true
    - job: gradle-build-payment-processor-lambda
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - cd backend
    - docker image build -t $ECR_REGISTRY/eventpro-payment-processor:$VERSION -f lambdas/payment-processor/Dockerfile .
    - docker image push $ECR_REGISTRY/eventpro-payment-processor:$VERSION

docker-build-notification-sender-lambda:
  extends: .docker-build-ecr
  needs:
    - job: calculate-version
      artifacts: true
    - job: gradle-build-notification-sender-lambda
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - cd backend
    - docker image build -t $ECR_REGISTRY/eventpro-notification-sender:$VERSION -f lambdas/notification-sender/Dockerfile .
    - docker image push $ECR_REGISTRY/eventpro-notification-sender:$VERSION

terraform-deploy-eventpro:
  extends: .terraform-base
  stage: deploy
  needs:
    - job: calculate-version
      artifacts: true
    - job: docker-build-secret-rotation-lambda
    - job: docker-build-backend
    - job: docker-build-order-processor-lambda
    - job: docker-build-payment-processor-lambda
    - job: docker-build-notification-sender-lambda
  script:
    - |
      terraform apply --auto-approve \
        -var="backend_image=$ECR_REGISTRY/eventpro-backend:$VERSION" \
        -var="secret_rotation_lambda_image=$ECR_REGISTRY/eventpro-secret-rotation:$VERSION" \
        -var="order_processor_lambda_image=$ECR_REGISTRY/eventpro-order-processor:$VERSION" \
        -var="payment_processor_lambda_image=$ECR_REGISTRY/eventpro-payment-processor:$VERSION" \
        -var="notification_sender_lambda_image=$ECR_REGISTRY/eventpro-notification-sender:$VERSION" \
        -var="stripe_secret_key=${STRIPE_SECRET_KEY:-}" \
        -var="stripe_publishable_key=${STRIPE_PUBLISHABLE_KEY:-}" \
        -var="stripe_webhook_secret=${STRIPE_WEBHOOK_SECRET:-}"
    # Extract outputs for GitLab Environment and downstream jobs
    - echo "ALB_URL=https://$(terraform output -raw alb_dns_name)" >> deploy.env
    - echo "API_FQDN=$(terraform output -raw api_fqdn)" >> deploy.env
    - echo "COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> deploy.env
    - echo "COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> deploy.env
    - echo "S3_IMAGES_BUCKET=$(terraform output -raw images_bucket_name)" >> deploy.env
    - echo "AWS_REGION=$(terraform output -raw aws_region)" >> deploy.env
    # Frontend build variables
    - echo "VITE_API_BASE_URL=https://$(terraform output -raw api_fqdn)" >> deploy.env
    - echo "VITE_COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> deploy.env
    - echo "VITE_COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> deploy.env
    - echo "VITE_AWS_REGION=$(terraform output -raw aws_region)" >> deploy.env
    - echo "VITE_S3_BUCKET_NAME=$(terraform output -raw images_bucket_name)" >> deploy.env
    - echo "Application Load Balancer URL is https://$(terraform output -raw alb_dns_name)"
  artifacts:
    reports:
      dotenv: deploy.env
    paths:
      - deploy.env
    expire_in: 1 hour
  environment:
    name: production
    url: $ALB_URL
  when: manual

# Frontend build for deployment (with environment variables from Terraform)
build-frontend:
  stage: post-deploy
  image: node:22-alpine
  needs:
    - job: terraform-deploy-eventpro
      artifacts: true
  before_script:
    # Load environment variables from Terraform outputs (deploy.env)
    - |
      if [ -f deploy.env ]; then
        set -a
        source deploy.env
        set +a
        echo "Loaded environment variables from deploy.env"
      else
        echo "ERROR: deploy.env not found. Terraform deployment may have failed."
        exit 1
      fi
    - cd frontend
  script:
    - echo "Building frontend with:"
    - echo "  VITE_API_BASE_URL=$VITE_API_BASE_URL"
    - echo "  VITE_COGNITO_USER_POOL_ID=$VITE_COGNITO_USER_POOL_ID"
    - echo "  VITE_COGNITO_CLIENT_ID=$VITE_COGNITO_CLIENT_ID"
    - echo "  VITE_AWS_REGION=$VITE_AWS_REGION"
    - echo "  VITE_S3_BUCKET_NAME=$VITE_S3_BUCKET_NAME"
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

serve-frontend-static-files:
  stage: post-deploy
  image: amazon/aws-cli:2.23.0
  needs: 
    - job: terraform-deploy-eventpro
      artifacts: true
    - job: build-frontend
      artifacts: true
  before_script:
    # Load environment variables from Terraform outputs
    - |
      if [ -f deploy.env ]; then
        set -a
        source deploy.env
        set +a
      fi
    - cd infrastructure/environments/dev
    - terraform init -upgrade
  script:
    - S3_BUCKET=$(terraform output -raw frontend_bucket_name)
    - echo "Uploading frontend static files to $S3_BUCKET"
    - aws s3 sync ../../../frontend/dist/ s3://$S3_BUCKET/ --delete
    - echo "Frontend static files uploaded to s3://$S3_BUCKET"
    - echo "Frontend URL https://$(terraform output -raw frontend_fqdn)"

create-release:
  extends: .create-release
  stage: release
  needs:
    - job: calculate-version
      artifacts: true
    - job: serve-frontend-static-files
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform-destroy-eventpro:
  extends: .terraform-base
  stage: tear-down
  needs:
    - job: calculate-version
      artifacts: true
  script:
    - |
      terraform destroy --auto-approve \
        -var="backend_image=$ECR_REGISTRY/eventpro-backend:$VERSION" \
        -var="secret_rotation_lambda_image=$ECR_REGISTRY/eventpro-secret-rotation:$VERSION" \
        -var="order_processor_lambda_image=$ECR_REGISTRY/eventpro-order-processor:$VERSION" \
        -var="payment_processor_lambda_image=$ECR_REGISTRY/eventpro-payment-processor:$VERSION" \
        -var="notification_sender_lambda_image=$ECR_REGISTRY/eventpro-notification-sender:$VERSION" 
  when: manual
